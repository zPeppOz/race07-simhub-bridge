[Window]
; Remove the window frame in windowed mode (WINDOWEDMODE=1 in Config.ini).
Borderless=1
; Render at physical pixels on scaled (125%, 150%...) desktops.
DpiAware=1

[SimHub]
; Publish $rFactorShared$; select GTR2 as the game in SimHub.
SharedMemory=1

[Debug]
; Seconds between raw .data snapshots into race07bridge.dump (~10 MB each). 0 = off.
DumpInterval=0
